<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Raptors Car Dealer — Tu próximo carro en Caracas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #05070a;
      background-image:
        radial-gradient(circle at 50% 0%, rgba(0, 168, 255, 0.18) 0%, transparent 55%),
        radial-gradient(circle at 85% 80%, rgba(0, 119, 255, 0.1) 0%, transparent 45%);
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
    }

    header {
      background: rgba(5, 8, 14, 0.92);
      backdrop-filter: blur(8px);
      padding: 14px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #00a8ff;
      box-shadow: 0 4px 25px rgba(0, 168, 255, 0.35);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    header img {
      height: 85px;
      width: auto;
      object-fit: contain;
      background: transparent;
      filter: drop-shadow(0 0 10px rgba(0, 168, 255, 0.6));
      transition: transform 0.3s ease;
    }

    header img:hover {
      transform: scale(1.05);
    }

    .brand-tag {
      font-family: 'Orbitron', sans-serif;
      color: #00d2ff;
      font-weight: 900;
      letter-spacing: 2.5px;
      font-size: 18px;
      text-shadow: 0 0 12px rgba(0, 210, 255, 0.75);
    }

    .badge-location {
      background: rgba(0, 168, 255, 0.12);
      border: 1px solid #00a8ff;
      color: #7dd3fc;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 0 12px rgba(0, 168, 255, 0.3);
    }

    .hero {
      text-align: center;
      padding: 60px 20px 44px;
    }

    .hero-eyebrow {
      display: inline-block;
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      letter-spacing: 3px;
      color: #00d2ff;
      text-transform: uppercase;
      margin-bottom: 14px;
      text-shadow: 0 0 10px rgba(0, 210, 255, 0.7);
    }

    .hero h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 34px;
      font-weight: 900;
      line-height: 1.25;
      max-width: 780px;
      margin: 0 auto 16px;
      background: linear-gradient(90deg, #ffffff 0%, #7dd3fc 50%, #00a8ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      color: #cbd5e1;
      font-size: 16px;
      max-width: 560px;
      margin: 0 auto;
    }

    .grid {
      max-width: 1120px;
      margin: 20px auto 60px;
      padding: 0 24px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 28px;
    }

    .card {
      background: linear-gradient(180deg, #0e131d 0%, #080b10 100%);
      border: 1px solid rgba(0, 168, 255, 0.35);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 15px rgba(0, 168, 255, 0.12);
      transition: transform 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease;
    }

    .card:hover {
      transform: translateY(-8px);
      border-color: #00d2ff;
      box-shadow: 0 18px 38px rgba(0, 0, 0, 0.85), 0 0 28px rgba(0, 210, 255, 0.45);
    }

    .card-img-wrap {
      position: relative;
      overflow: hidden;
      background: #000;
      cursor: pointer;
    }

    .card-img-wrap > img.car-photo {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
      transition: transform 0.45s ease;
    }

    .card:hover .card-img-wrap > img.car-photo {
      transform: scale(1.06);
    }

    .brand-emblem {
      position: absolute;
      top: 12px;
      left: 12px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #1e293b 0%, #05080f 90%);
      border: 1.5px solid #00d2ff;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.8), 0 0 12px rgba(0, 210, 255, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 7px;
      z-index: 2;
    }

    .brand-emblem img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: brightness(0) invert(1) drop-shadow(0 0 4px rgba(0, 210, 255, 0.6));
    }

    .card-tag {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(5, 8, 14, 0.85);
      border: 1px solid #00d2ff;
      color: #00d2ff;
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.4);
      z-index: 2;
    }

    .card-body {
      padding: 22px;
    }

    .card-brand-label {
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #7dd3fc;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .card-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 8px;
      color: #ffffff;
      letter-spacing: 0.5px;
      cursor: pointer;
    }

    .card-price {
      font-family: 'Orbitron', sans-serif;
      font-size: 26px;
      font-weight: 900;
      color: #00d2ff;
      text-shadow: 0 0 14px rgba(0, 210, 255, 0.65);
      margin-bottom: 12px;
    }

    .card-specs {
      color: #94a3b8;
      font-size: 13px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.04);
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      border-left: 3px solid #00a8ff;
    }

    .card-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-detail {
      background: rgba(0, 168, 255, 0.12);
      border: 1px solid rgba(0, 210, 255, 0.6);
      color: #7dd3fc;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 11px 14px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .btn-detail:hover {
      background: rgba(0, 210, 255, 0.25);
      color: #ffffff;
    }

    @keyframes pulsoVibracion {
      0%, 75%, 100% { transform: translateX(0) scale(1); }
      78% { transform: translateX(-3px) rotate(-1deg) scale(1.02); }
      81% { transform: translateX(3px) rotate(1deg) scale(1.02); }
      84% { transform: translateX(-2px) rotate(-0.5deg) scale(1.02); }
      87% { transform: translateX(2px) rotate(0.5deg) scale(1.02); }
      90% { transform: translateX(0) scale(1); }
    }

    .btn-wa {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: linear-gradient(135deg, #25d366 0%, #12b854 100%);
      color: #03150a;
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      text-decoration: none;
      padding: 14px 16px;
      border-radius: 10px;
      box-shadow: 0 0 18px rgba(37, 211, 102, 0.45);
      animation: pulsoVibracion 3.5s infinite ease-in-out;
      transition: filter 0.25s ease, box-shadow 0.25s ease;
    }

    .btn-wa:hover {
      filter: brightness(1.1);
      box-shadow: 0 0 26px rgba(37, 211, 102, 0.8);
      animation: none;
    }

    /* VENTANA DE FICHA BÁSICA */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(2, 5, 10, 0.88);
      backdrop-filter: blur(6px);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      background: linear-gradient(180deg, #101724 0%, #070a10 100%);
      border: 1px solid #00d2ff;
      border-radius: 18px;
